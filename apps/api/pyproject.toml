[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "flight-tracker-api"
version = "0.1.0"
description = "Window-oriented flight tracker API"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["flight_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["flight_tracker"]

